# Trening na RunPodzie: big (~130M param), pelny miks + augmentacja, tokenizer BPE.
# Wariant config_runpod_big_all.yaml z tokenizerem BPE (sentencepiece) zamiast char.
#
#   cd /workspace/aka-asr
#   python train.py configs/config_runpod_big_bpe.yaml
#   python train.py configs/config_runpod_big_bpe.yaml --resume /workspace/aka-asr/checkpoints/conformer_big/<exp>/last.pt
#
# WYMAGA pliku bpe_pl.model w repo (wytrenowany utils/train_bpe.py, vocab 512,
# dojezdza na pod przez git -- wyjatek w .gitignore). sentencepiece z requirements.txt.
# Dane: patrz runpod/README.md.

data:
  train_manifest_path: /workspace/aka-asr/data/train_manifest_all.jsonl
  val_manifest_path: /workspace/aka-asr/data/val_manifest_all.jsonl
  max_audio_len: 20.0
  min_audio_len: 0.5
  feature_cache_dir: /workspace/aka-asr/data/features_cache

tokenizer:
  type: bpe
  bpe_model_path: bpe_pl.model    # sciezka wzgledna repo (CWD=/workspace/aka-asr na
                                  # podzie, root repo lokalnie) -> demo apka odtwarza
                                  # tokenizer z metadanych checkpointu po tej sciezce

augment:
  noise_dir: /workspace/aka-asr/data/RIRS_NOISES/pointsource_noises
  rir_dir: /workspace/aka-asr/data/RIRS_NOISES/simulated_rirs
  prob: 0.4
  noise_prob: 0.9
  rir_prob: 0.5
  snr_db: [5, 25]
  speed_perturb: [0.9, 1.0, 1.1]  # perturbacja tempa (Kaldi); ~2/3 sampli omija
                                  # feature_cache (mel on-the-fly) -> wiekszy koszt
                                  # dataloadera; usun linie zeby wylaczyc

model:
  size: big
  dropout: 0.1

training:
  epochs: 30
  batch_size: 128
  max_batch_duration: 450.0      # jak w wariancie char: BPE-512 NIE zwieksza VRAM
                                 # jointa. Dominuje tensor (B,T',U,640); U spada
                                 # ~2,1x (subwordy dluzsze od znakow), co znosi
                                 # wzrost vocab 37->513. Zmierzony koszt ~0,8x char.
                                 # try/except OOM w petli pomija skrajny batch.
  n_workers: 12
  lr: 0.0004                     # OBNIZONE z 7e-4: forensyka runu 2026-07-23_22-03-54
                                  # (tb) pokazala niestabilnosc RNN-T -- loss_rnnt
                                  # oscylowal 34<->254 z grad spikes 319 PO warmupie,
                                  # aux CTC caly czas stabilny ~5.6. To nie blank-
                                  # collapse tylko rozjazd optymalizacji przy za
                                  # wysokim peak LR -> nizej. (mid dzialal na 1e-3,
                                  # ale mid=29M; big=131M jest wrazliwszy)
  weight_decay: 0.000001
  warmup_steps: 4000
  grad_clip: 1.0
  accum_grad: 1
  amp_dtype: bf16
  ctc_weight: 0.3                 # z powrotem 0.3 -- aux CTC nigdy nie byl problemem
                                  # (stabilny 5.6), podbicie do 0.5 nic nie dalo
  ctc_label_smoothing: 0.05      # wygladzanie tylko aux CTC (RNN-T bez zmian)
  collapse_abort_epochs: 2       # jesli po 2 epokach WER wciaz ~100% -> abort
                                  # (~25 min zamiast 6.5 h); przy tanim abortcie
                                  # latwo iterowac po LR/augmentacji
  log_every: 50
  eval_every_epochs: 1
  save_every_steps: 1000
  keep_last: 3
  wer_max_samples: 500
  max_symbols_per_step: 3
  compile: false
  tensorboard: true
  ckpt_root: /workspace/aka-asr/checkpoints
  seed: 42
