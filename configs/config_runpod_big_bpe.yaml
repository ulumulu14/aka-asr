# Trening na RunPodzie: big (~130M param), pelny miks + augmentacja, tokenizer BPE.
# Wariant config_runpod_big_all.yaml z tokenizerem BPE (sentencepiece) zamiast char.
#
#   cd /workspace/aka-asr
#   python train.py configs/config_runpod_big_bpe.yaml
#   python train.py configs/config_runpod_big_bpe.yaml --resume /workspace/aka-asr/checkpoints/conformer_big/<exp>/last.pt
#
# WYMAGA pliku bpe_pl.model w repo (wytrenowany utils/train_bpe.py, vocab 512,
# dojezdza na pod przez git -- wyjatek w .gitignore). sentencepiece z requirements.txt.
# Dane: patrz runpod/README.md.

data:
  train_manifest_path: /workspace/aka-asr/data/train_manifest_all.jsonl
  val_manifest_path: /workspace/aka-asr/data/val_manifest_all.jsonl
  max_audio_len: 20.0
  min_audio_len: 0.5
  feature_cache_dir: /workspace/aka-asr/data/features_cache
  bad_list_path: /workspace/aka-asr/data/bad_audio.txt  # denylist uszkodzonego audio:
                                  # wykluczane przy starcie, nowe dopisywane w trakcie
                                  # (cicho, bez spamu w logu). Trwa na volume miedzy runami.
  max_token_frame_ratio: 0.5     # filtr U>T': odrzuc sample gdzie tokeny > 0.5*ramki
                                  # po subsamplingu. Zdrowa mowa ma U/T' ~0.2 (p99.9=0.43);
                                  # anomalie (krotki klip + dlugi tekst, max zmierzony 62!)
                                  # rozrywaja loss_rnnt -> grad explosion -> blank-collapse.
                                  # To BYLA przyczyna collapse na 4e-4 i 5e-4 (CV-26 validated).

tokenizer:
  type: bpe
  bpe_model_path: bpe_pl.model    # sciezka wzgledna repo (CWD=/workspace/aka-asr na
                                  # podzie, root repo lokalnie) -> demo apka odtwarza
                                  # tokenizer z metadanych checkpointu po tej sciezce

augment:
  noise_dir: /workspace/aka-asr/data/RIRS_NOISES/pointsource_noises
  rir_dir: /workspace/aka-asr/data/RIRS_NOISES/simulated_rirs
  # rir/noise/speed rolowane NIEZALEZNIE per sample -> wszystkie kombinacje moga
  # wypasc (w tym zadna = czyste + SpecAug). noise_prob/rir_prob to teraz osobne
  # prawdopodobienstwa (nie ma juz wspolnej bramki 'prob'). 0.5/0.5 = zbalansowane
  # kombinacje; podnies noise_prob dla wiekszej odpornosci na szum.
  noise_prob: 0.5
  rir_prob: 0.5
  snr_db: [5, 25]
  speed_perturb: [0.9, 1.0, 1.1]  # perturbacja tempa (Kaldi); 1.0 = bez zmiany (~2/3 sampli)
  copies: 1                     # test B: jak w zdrowym runie 17,10% (copies weszlo
                                  # pozniej); wrocic do 2 po potwierdzeniu stabilnosci

model:
  size: big
  dropout: 0.1
  blank_bias_init: -4.0          # ujemny bias blanku w jointcie (tylko swiezy run):
                                  # przeciwdziala blank-dominacji, ktora przy BPE
                                  # (krotkie U -> duzo blanku) daje pusty greedy /
                                  # val_WER~100% od ep0. LR juz naprawil stabilnosc,
                                  # to celuje w drugi problem (blank-dominacje)

training:
  epochs: 100                    # przy copies=2 na miksie ~600h: ~9k krokow/epoke,
                                 # ~33 min/epoka -> ~2,3 dnia H100 (na 438h: ~1,8 dnia).
                                 # best.pt na biezaco -> przy plateau mozna uciac
                                 # wczesniej; cosine trzyma LR do konca (floor 0.1).
  batch_size: 128
  max_batch_duration: 450.0      # jak w wariancie char: BPE-512 NIE zwieksza VRAM
                                 # jointa. Dominuje tensor (B,T',U,640); U spada
                                 # ~2,1x (subwordy dluzsze od znakow), co znosi
                                 # wzrost vocab 37->513. Zmierzony koszt ~0,8x char.
                                 # try/except OOM w petli pomija skrajny batch.
  n_workers: 12
  lr: 0.0004                     # 4e-4: ZNANY-DOBRY (jedyny run bez collapse = 17,10%
                                  # mial 4e-4). 5e-4 PRZYWROCILO blank-collapse (2026-07-26:
                                  # val_WER 100% przez 5 epok, greedy pusty) mimo blank-bias
                                  # -4 -- cosine trzyma peak dluzej niz Noam, wiec 5e-4+cosine
                                  # bylo za agresywne. Nie podnosic bez rozwiazania collapse.
  weight_decay: 0.000001
  warmup_steps: 4000
  lr_schedule: noam            # POWROT do noama (bylo cosine): 4 collapse z rzedu na
                                # cosine przy "tym samym" lr -- ale cosine trzyma peak
                                # 4e-4 przez cale okno ucieczki z blanku, podczas gdy
                                # zdrowy run 17,10% (noam) mial tam efektywnie 1.2-2.3e-4
                                # (decay 1/sqrt po warmupie). To NIE bylo to samo 4e-4.
  grad_clip: 1.0
  accum_grad: 1
  amp_dtype: bf16
  ctc_weight: 0.3                 # z powrotem 0.3 -- aux CTC nigdy nie byl problemem
                                  # (stabilny 5.6), podbicie do 0.5 nic nie dalo
  ctc_label_smoothing: 0.05      # wygladzanie tylko aux CTC (RNN-T bez zmian)
  loss_spike_multiplier: 3.0     # skip batcha gdy loss_rnnt > 3x mediana ostatnich.
                                  # Diagnoza z tb: filtr U>T' naprawil grad, ale zostaly
                                  # spike loss_rnnt 212-312 (typowe 33-77) co ~epoke ->
                                  # wybijaly model w blank (greedy pusty). 3x oddziela
                                  # spike (4-6x) od normalnych wahan (~2x).
  collapse_abort_epochs: 5       # guard anty blank-collapse zluzowany (bylo 2): w
                                  # udanym runie 17,10% przelom przyszedl dopiero w
                                  # epoce 3 (66% WER) -- za ostry prog ubilby zdrowy,
                                  # wolno startujacy run. 5 daje margines po przelomie;
                                  # koszt nieudanego startu ~2,75h zamiast ~1,1h.
  log_every: 50
  eval_every_epochs: 1
  save_every_steps: 1000
  keep_last: 3
  wer_max_samples: 500
  wer_random_subset: true        # WER na losowym podzbiorze val (staly seed) zamiast
                                  # 500 NAJKROTSZYCH klipow (med 1.5s / 2 slowa, 70%
                                  # komend bigos -- najtrudniejszy wycinek, mylil guard
                                  # anty-collapse). UWAGA: liczby WER nieporownywalne
                                  # 1:1 z historycznymi runami (tamte mierzyly shortest).
  max_symbols_per_step: 3
  compile: false
  tensorboard: true
  hf_repo: aka-asr-v1            # sync na HF Hub: metryki co epoke + best.pt async.
                                # Bez namespace -> repo tworzone pod wlascicielem
                                # HF_TOKEN (musi miec prawo ZAPISU). Brak -> off.
  hf_private: true
  ckpt_root: /workspace/aka-asr/checkpoints
  seed: 42
