# Trening na RunPodzie: gigant (~319M param), pelny miks + augmentacja, tokenizer BPE.
# Wariant config_runpod_big_bpe.yaml przeskalowany na model.size=gigant (enc 768/20).
#
#   cd /workspace/aka-asr
#   python train.py configs/config_runpod_gigant_bpe.yaml
#   python train.py configs/config_runpod_gigant_bpe.yaml --resume /workspace/aka-asr/checkpoints/conformer_giga/<exp>/last.pt
#
# WYMAGA rozmiaru `gigant` w MODEL_SIZES (model.py) -- git pull po commicie rename
# custom->giga->gigant. Reszta wymagan jak big_bpe (bpe_pl.model w repo, dane: runpod/README.md).
#
# KALIBRACJA vs big (jedyne 3 zmiany, reszta = zwalidowany przepis cosine big):
#   lr 2.5e-4 -> 2e-4        skala ~1/sqrt(width) 512->768; wiekszy model = wrazliwszy
#                            (mid 1e-3 OK, big collapse przy 4e-4, zdrowy przy 2.5e-4)
#   warmup 4000 -> 6000      wiekszy model potrzebuje dluzszego rozbiegu stabilnosci
#   budzet 450 -> 300        aktywacje rosna ~1.7x (enc_dim 1.5x, layers 1.18x,
#                            joint 640->768); 300 daje margines na H100 80GB --
#                            SKALIBROWAC na realnym VRAM po 1. epoce (nvidia-smi)

data:
  train_manifest_path: /workspace/aka-asr/data/train_manifest_all.jsonl
  val_manifest_path: /workspace/aka-asr/data/val_manifest_all.jsonl
  max_audio_len: 20.0
  min_audio_len: 0.5
  feature_cache_dir: /workspace/aka-asr/data/features_cache
  bad_list_path: /workspace/aka-asr/data/bad_audio.txt
  max_token_frame_ratio: 0.5     # filtr U>T' -- patrz big_bpe (byla przyczyna collapse)

tokenizer:
  type: bpe
  bpe_model_path: bpe_pl.model

augment:
  noise_dir: /workspace/aka-asr/data/RIRS_NOISES/pointsource_noises
  rir_dir: /workspace/aka-asr/data/RIRS_NOISES/simulated_rirs
  noise_prob: 0.5
  rir_prob: 0.5
  snr_db: [5, 25]
  speed_perturb: [0.9, 1.0, 1.1]
  copies: 1

model:
  size: gigant
  dropout: 0.1
  blank_bias_init: -4.0          # -6 SFALSYFIKOWANE (run 06-11-21: krzywa identyczna z -4,
                                 # oba plateau val_loss ~115) -> wracamy do -4 jak big

training:
  epochs: 40
  batch_size: 128                # cap na krotkich klipach; budzet ponizej wiaze pierwszy
  max_batch_duration: 300.0      # 450 biga * ~1/1.5 (wzrost aktywacji gigant); przy OOM
                                 # zbic do 250, przy VRAM <70% mozna podniesc do 350
  n_workers: 12
  lr: 0.00025                    # proba 3: PELNY znany-dobry profil optymalizatora biga
                                 # (2,5e-4 + warmup 4000). Moje skalowanie w dol (2e-4/6000)
                                 # najpewniej zdusilo ucieczke z blanku: dwa runy (bias -4/-6)
                                 # plateau val_loss ~115 przy SPOKOJNYM gradzie (32) = zapas
                                 # stabilnosci jest. Jesli i to stanie -> winne dane (granary,
                                 # dluzsze segmenty = glebszy basen blanku) -> test big@granary
  weight_decay: 0.000001
  warmup_steps: 4000
  lr_schedule: cosine
  min_lr_ratio: 0.1              # floor = 2e-5
  grad_clip: 1.0
  accum_grad: 1
  amp_dtype: bf16
  ctc_weight: 0.3
  ctc_label_smoothing: 0.05
  ctc_warmup_steps: 12000        # REMEDIUM blank-stall gigi (3 runy stanely; big smigal
                                 # na tych samych danych/profilu => wina architektury):
                                 # ~1,3 epoki tylko encoder+CTC (RNN-T nieliczony),
                                 # potem joint startuje na wyuczonym alignmencie.
                                 # UWAGA: epoki fazy CTC maja val_WER ~100% (joint na
                                 # init) i licza sie do guarda (8) -- zostaje ~6,5
                                 # epoki na ucieczke po wlaczeniu RNN-T.
  loss_spike_multiplier: 3.0     # skip batcha przy spike loss_rnnt (jak big)
  collapse_abort_epochs: 8       # gigant: wolniejsza dynamika (2,4x param, nizszy peak,
                                 # dluzszy warmup) -> ucieczka z blanku moze przyjsc
                                 # pozniej niz u biga (ep1-3); epoka ~35 min = tania
                                 # cierpliwosc. Przy abort: RESUME=last.pt kontynuuje.
  log_every: 50
  eval_every_epochs: 1
  save_every_steps: 1000
  keep_last: 3
  wer_max_samples: 500
  wer_random_subset: true
  max_symbols_per_step: 3
  compile: false
  tensorboard: true
  hf_repo: aka-asr-v1
  hf_private: true
  ckpt_root: /workspace/aka-asr/checkpoints
  seed: 42
