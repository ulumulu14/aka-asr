# Trening na RunPodzie: big + BPE na miksie z YODAS-GRANARY zamiast surowego yodas.
# Mirror config_runpod_big_bpe.yaml -- JEDYNA roznica: train_manifest_all_granary.jsonl
# (cv/mls/bigos/vox + espnet/yodas-granary ~680h pseudo Whisper-v3 filtrowane przez
# NVIDIA, zamiast yodas-40 z surowych napisow YT 379h). Val TEN SAM -> val_WER
# porownywalny 1:1 ze starym miksem (czysty A/B wplywu danych).
#
#   # dane (po df -h /workspace; parquety ~78 GB transientnie, wavy ~78 GB):
#   python utils/datasets_conversion/hf2json.py --out-root /workspace/aka-asr/data \
#       --manifest-dir /workspace/aka-asr/data yodas_granary
#   cat /workspace/aka-asr/data/train_manifest_{cv,mls,bigos,voxpopuli}.jsonl \
#       /workspace/aka-asr/data/train_manifest_yodas_granary.jsonl \
#       > /workspace/aka-asr/data/train_manifest_all_granary.jsonl
#   CONFIG=configs/config_runpod_big_bpe_granary.yaml bash runpod/train.sh
#
# Miks ~1085 h (~1.4x godzin starego) -> ~1.4x krokow/epoke przy tym samym budzecie.
# Granary ma segmenty do 40 s -- czesc >20 s utnie max_audio_len (konwerter raportuje).

data:
  train_manifest_path: /workspace/aka-asr/data/train_manifest_all_granary.jsonl
  val_manifest_path: /workspace/aka-asr/data/val_manifest_all.jsonl
  max_audio_len: 20.0
  min_audio_len: 0.5
  feature_cache_dir: /workspace/aka-asr/data/features_cache
  bad_list_path: /workspace/aka-asr/data/bad_audio.txt
  max_token_frame_ratio: 0.5     # filtr U>T' -- patrz big_bpe (byla przyczyna collapse)

tokenizer:
  type: bpe
  bpe_model_path: bpe_pl.model

augment:
  noise_dir: /workspace/aka-asr/data/RIRS_NOISES/pointsource_noises
  rir_dir: /workspace/aka-asr/data/RIRS_NOISES/simulated_rirs
  noise_prob: 0.5
  rir_prob: 0.5
  snr_db: [5, 25]
  speed_perturb: [0.9, 1.0, 1.1]
  copies: 1

model:
  size: big
  dropout: 0.1
  blank_bias_init: -4.0          # anty blank-dominacja BPE (tylko swiezy run)

training:
  epochs: 40
  batch_size: 128
  max_batch_duration: 450.0
  n_workers: 12
  lr: 0.00025                    # cosine peak 2.5e-4 -- zwalidowany (zdrowy start,
                                 # ep7 25% w runie 2026-07-28); NIE podnosic
  weight_decay: 0.000001
  warmup_steps: 4000
  lr_schedule: cosine
  min_lr_ratio: 0.1
  grad_clip: 1.0
  accum_grad: 1
  amp_dtype: bf16
  ctc_weight: 0.3
  ctc_label_smoothing: 0.05
  loss_spike_multiplier: 3.0
  collapse_abort_epochs: 5
  log_every: 50
  eval_every_epochs: 1
  save_every_steps: 1000
  keep_last: 3
  wer_max_samples: 500
  wer_random_subset: true
  max_symbols_per_step: 3
  compile: false
  tensorboard: true
  hf_repo: aka-asr-v1            # HF_TOKEN w env PRZED startem (pada po restarcie poda!)
  hf_private: true
  ckpt_root: /workspace/aka-asr/checkpoints
  seed: 42
